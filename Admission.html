<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<style>
  /* Banner */
.admission-banner {
  text-align: center;
  background: #fff;
  padding: 50px 400px;
}

.admission-banner img {
  max-width: 90%;
  height: auto;
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

/* Admission Form */
.admission-form {
  background: #f8f9fa;
  padding: 50px 20px;
  text-align: center;
}

.admission-form h2 {
  color: #0056a3;
  font-size: 28px;
  margin-bottom: 15px;
}

.admission-form p {
  color: #444;
  font-size: 16px;
  margin-bottom: 25px;
}

.form-box {
  margin-top: 20px;
}

.btn-admission {
  display: inline-block;
  background: #0056a3;
  color: #fff;
  font-size: 18px;
  padding: 12px 25px;
  border-radius: 6px;
  text-decoration: none;
  transition: 0.3s;
}

.btn-admission:hover {
  background: #003d73;
}

/* Contact Admissions Button */
.admissions {
  margin: 40px 0;
  text-align: center;
}

.admission-cta .btn {
  display: inline-block;
  background: #28a745;
  color: #fff;
  font-size: 18px;
  padding: 12px 25px;
  border-radius: 6px;
  text-decoration: none;
  transition: 0.3s;
}

.admission-cta .btn:hover {
  background: #1e7e34;
}

</style>
</head>
<body>
  <!-- Header placeholder -->
  <div id="header"></div>

  <!-- Banner Image -->
  <section class="admission-banner">
    <div class="banner-container">
      <img src="assets/banner.jpeg" alt="School of Architecture Admission Banner">
    </div>
  </section>

  <!-- Admission Form Section -->
  <section class="admission-form">
    <div class="container">
      <h2>Admission Enquiry</h2>
      <p>If you are interested in joining our institution, please fill out the admission form below. Our team will get back to you soon.</p>
      
      <div class="form-box">
        <a href="https://forms.gle/EmFTA5wp6wMseXtZ8" target="_blank" class="btn-admission">
          Fill Admission Form
        </a>
      </div>
    </div>
  </section>

  <!-- Admission Contact Section -->
  <section class="admissions">
    <div class="admission-cta">
      <a href="contact.html" class="btn">Contact Admissions</a>
    </div>
  </section>

  <!-- Footer placeholder -->
  <div id="footer"></div>

  <!-- Load Header & Footer -->
  <script>
        // Load Header
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

                // After header is loaded, attach the menu toggle event
                const menu = document.querySelector('.menu');
                const menuIcon = document.querySelector('.menu-icon');
                if(menu && menuIcon) {
                    menuIcon.addEventListener('click', () => {
                        menu.classList.toggle('show');
                    });
                }
            });

        // Load Footer
        fetch("footer.html")
            .then(response => response.text())
            .then(data => document.getElementById("footer").innerHTML = data);
    </script>
</body>
</html>
