<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <style>
        /* Yellow banner section */
        .page-banner {
            background: #FFD500; /* Yellow */
            text-align: center;
            padding: 60px 20px;
        }
        .page-banner h1 {
            font-size: 36px;
            font-weight: bold;
            margin: 0;
            color: #000;
        }

        /* Content section */
        main {
            min-height: 60vh;
            padding: 40px 20px;
            text-align: center;
        }
        main h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* Certificate button */
        .pdf-btn {
            display: inline-block;
            padding: 15px 30px;
            background: #fff;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 18px;
            text-decoration: none;
            color: #000;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .pdf-btn:hover {
            background: #f1f1f1;
            transform: scale(1.05);
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .page-banner {
                padding: 40px 10px; /* Adjust padding for mobile */
            }
            .page-banner h1 {
                font-size: 28px; /* Smaller font size for mobile */
            }
            main h2 {
                font-size: 20px; /* Smaller heading size for mobile */
            }
            .pdf-btn {
                padding: 12px 20px; /* Smaller button padding for mobile */
                font-size: 16px; /* Smaller font size for mobile */
            }
        }
    </style>
</head>
<body>

    <!-- Header placeholder -->
    <div id="header"></div>

    <!-- Yellow banner like AISHE -->
    <div class="page-banner">
        <h1>AISHE</h1>
    </div>

    <!-- Main content -->
    <main>
        <h2>Academic Year 2025-26</h2>
        <!-- Certificate button that opens PDF in new tab -->
        <a href="assets/AISHE Certificate 2025.pdf" target="_blank" class="pdf-btn">
            📄 Certificate
        </a>
    </main>

    <!-- Footer placeholder -->
    <div id="footer"></div>

    <script>
        // Load Header
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

                // After header is loaded, attach the menu toggle event
                const menu = document.querySelector('.menu');
                const menuIcon = document.querySelector('.menu-icon');
                if(menu && menuIcon) {
                    menuIcon.addEventListener('click', () => {
                        menu.classList.toggle('show');
                    });
                }
            });

        // Load Footer
        fetch("footer.html")
            .then(response => response.text())
            .then(data => document.getElementById("footer").innerHTML = data);
    </script>
</body>
</html>
